<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allahardan Telecom</title>
    <meta name="theme-color" content="#1B365D">
    
    <!-- PWA Manifest Link -->
    <link rel="manifest" href="manifest.json">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="Allahardan Telecom 192.png">
    <link rel="apple-touch-icon" sizes="192x192" href="Allahardan Telecom 192.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brandBlue: '#1B365D',
                        brandOrange: '#F26522',
                        brandYellow: '#FFDE17',
                        brandSky: '#00A8E8',
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap');
        body { font-family: 'Hind Siliguri', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 pb-24 md:pb-0">

    <header class="bg-brandBlue text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-brandYellow text-brandBlue font-bold p-2 rounded-lg shadow">
                    <i class="fa-solid fa-mobile-screen-button text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">Allahardan Telecom</h1>
                    <p class="text-xs text-brandSky">Mobile Phone Sell and Service</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button id="install-btn" class="hidden bg-brandOrange text-white text-xs px-3 py-1.5 rounded-lg shadow animate-bounce">
                    <i class="fa-solid fa-download mr-1"></i> অ্যাপ ইনস্টল করুন
                </button>
                <span id="live-status" class="text-xs bg-yellow-500 text-white px-2.5 py-1 rounded-full">সংযুক্ত হচ্ছে...</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-4 md:p-6 grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- Dashboard Cards -->
        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-brandBlue flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-500">মোট প্রোডাক্ট স্টক</p>
                <h3 id="total-stock" class="text-2xl font-bold text-brandBlue">০ পিস</h3>
            </div>
            <div class="bg-blue-50 p-3 rounded-full text-brandBlue">
                <i class="fa-solid fa-boxes-stacked text-xl"></i>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-brandOrange flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-500">আজকের মোট বিক্রি</p>
                <h3 id="total-sales" class="text-2xl font-bold text-brandOrange">৳ ০.০০</h3>
            </div>
            <div class="bg-orange-50 p-3 rounded-full text-brandOrange">
                <i class="fa-solid fa-cart-shopping text-xl"></i>
            </div>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-brandSky flex items-center justify-between">
            <div>
                <p class="text-sm text-gray-500">আজকের আয়-ব্যয় ব্যালেন্স</p>
                <h3 id="net-balance" class="text-2xl font-bold text-brandSky">৳ ০.০০</h3>
            </div>
            <div class="bg-cyan-50 p-3 rounded-full text-brandSky">
                <i class="fa-solid fa-wallet text-xl"></i>
            </div>
        </div>

        <section class="md:col-span-2 bg-white rounded-2xl shadow-sm p-5">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold text-brandBlue"><i class="fa-solid fa-list-check mr-2"></i>প্রোডাক্ট ও স্টক তালিকা</h2>
                <button onclick="fetchData()" class="text-sm bg-brandBlue text-white px-3 py-1.5 rounded-lg hover:bg-opacity-90 transition">
                    <i class="fa-solid fa-rotate mr-1"></i> রিফ্রেশ
                </button>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-xs text-gray-600 uppercase">
                            <th class="p-3 rounded-l-lg">প্রোডাক্ট নাম</th>
                            <th class="p-3">ক্যাটাগরি</th>
                            <th class="p-3">ক্রয় মূল্য</th>
                            <th class="p-3">বিক্রয় মূল্য</th>
                            <th class="p-3 rounded-r-lg">স্টক</th>
                        </tr>
                    </thead>
                    <tbody id="product-table-body" class="text-sm divide-y divide-gray-100">
                        <tr>
                            <td colspan="5" class="p-4 text-center text-gray-400">ডাটা লোড হচ্ছে...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section class="bg-white rounded-2xl shadow-sm p-5">
            <h2 class="text-lg font-bold text-brandOrange mb-4"><i class="fa-solid fa-plus-circle mr-2"></i>দ্রুত এন্ট্রি করুন</h2>
            <form id="entry-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">এন্ট্রির ধরন</label>
                    <select id="entry-type" onchange="toggleInputFields()" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-brandOrange outline-none">
                        <option value="Sale">পণ্য বিক্রি (Product Sale)</option>
                        <option value="Servicing">সার্ভিসিং আয় (Servicing)</option>
                        <option value="Income">অন্যান্য আয় (Other Income)</option>
                        <option value="Expense">ব্যয় (Expense)</option>
                    </select>
                </div>
                
                <!-- Product Dropdown (For Sales Only) -->
                <div id="product-select-group">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">প্রোডাক্ট নির্বাচন করুন (স্টক থেকে)</label>
                    <select id="entry-product" onchange="autoCalculatePrice()" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-brandOrange outline-none">
                        <option value="">লোড হচ্ছে...</option>
                    </select>
                </div>

                <!-- Text Input (For Servicing / Others) -->
                <div id="reason-text-group" class="hidden">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">বিবরণ লিখুন</label>
                    <input type="text" id="entry-reason" placeholder="যেমন: ডিসপ্লে পরিবর্তন / দোকান ভাড়া" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-brandOrange outline-none">
                </div>

                <!-- Quantity (For Sales Only) -->
                <div id="quantity-group">
                    <label class="block text-xs font-semibold text-gray-600 mb-1">পরিমাণ (Quantity)</label>
                    <input type="number" id="entry-quantity" value="1" min="1" oninput="autoCalculatePrice()" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-brandOrange outline-none">
                </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 mb-1">সর্বমোট টাকার পরিমাণ (৳)</label>
                    <input type="number" id="entry-amount" required placeholder="০.০০" class="w-full p-2.5 border rounded-xl text-sm focus:ring-2 focus:ring-brandOrange outline-none font-bold text-green-600">
                </div>
                <button type="submit" id="submit-btn" class="w-full bg-brandOrange text-white font-semibold py-3 rounded-xl shadow hover:bg-opacity-90 transition">
                    সেভ করুন
                </button>
            </form>
        </section>
    </main>

    <script>
        // এখানে আপনার দেওয়া Apps Script এর ডিপ্লয় লিংকটি বসানো হয়েছে
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzfMI_NlUh0clN_pcJm5epPUAVn6njZCKEYUT3hS9ETITKCrCGQWzlpQCcuB09HUnk/exec";

        let globalProductList = []; // ড্রপডাউনের জন্য গ্লোবাল ভেরিয়েবল 

        // === UI Toggle Logic ===
        function toggleInputFields() {
            const type = document.getElementById('entry-type').value;
            const prodGroup = document.getElementById('product-select-group');
            const qtyGroup = document.getElementById('quantity-group');
            const reasonGroup = document.getElementById('reason-text-group');
            const amountInput = document.getElementById('entry-amount');

            if (type === 'Sale') {
                prodGroup.classList.remove('hidden');
                qtyGroup.classList.remove('hidden');
                reasonGroup.classList.add('hidden');
                document.getElementById('entry-product').required = true;
                document.getElementById('entry-reason').required = false;
                autoCalculatePrice(); // অটো প্রাইস আপডেট
            } else {
                prodGroup.classList.add('hidden');
                qtyGroup.classList.add('hidden');
                reasonGroup.classList.remove('hidden');
                document.getElementById('entry-product').required = false;
                document.getElementById('entry-reason').required = true;
                amountInput.value = ""; // অন্য ক্যাটাগরিতে টাকা ম্যানুয়ালি বসাতে হবে
            }
        }

        // === Auto Calculate Price Logic ===
        function autoCalculatePrice() {
            if(document.getElementById('entry-type').value === 'Sale') {
                const prodName = document.getElementById('entry-product').value;
                const qty = Number(document.getElementById('entry-quantity').value) || 1;
                const prod = globalProductList.find(p => (p["Product Name"] || p.ProductName) === prodName);
                if(prod && prod.SellPrice) {
                    document.getElementById('entry-amount').value = (Number(prod.SellPrice) * qty).toFixed(0);
                } else {
                    document.getElementById('entry-amount').value = "";
                }
            }
        }

        function populateDropdown() {
            const select = document.getElementById('entry-product');
            select.innerHTML = '<option value="">-- প্রোডাক্ট সিলেক্ট করুন --</option>';
            globalProductList.forEach(p => {
                let pName = p["Product Name"] || p.ProductName;
                let stock = Number(p.Stock) || 0;
                if (pName && stock > 0) { // শুধু স্টক থাকা প্রোডাক্ট দেখাবে
                    select.innerHTML += `<option value="${pName}">${pName} (স্টক: ${stock})</option>`;
                }
            });
        }

        // === PWA Logic (Unchanged) ===
        let deferredPrompt;
        const installBtn = document.getElementById('install-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBtn.classList.remove('hidden');
        });
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                installBtn.classList.add('hidden');
            }
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }

        // === Fetch Data Logic ===
        function fetchData() {
            const statusEl = document.getElementById('live-status');
            statusEl.innerText = "লোড হচ্ছে...";
            statusEl.className = "text-xs bg-yellow-500 text-white px-2.5 py-1 rounded-full";

            const scriptName = 'jsonp_cb_' + Math.round(100000 * Math.random());
            const url = WEB_APP_URL + "?action=getData&callback=" + scriptName;
            
            window[scriptName] = function(result) {
                document.body.removeChild(scriptTag);
                delete window[scriptName];
                
                if(result.status === "success") {
                    globalProductList = result.products || []; // ডাটা সেভ
                    renderTable(result.products);
                    calculateSummary(result);
                    populateDropdown(); // ড্রপডাউন লোড
                    
                    statusEl.innerText = "Live Connected";
                    statusEl.className = "text-xs bg-green-500 text-white px-2.5 py-1 rounded-full animate-pulse";
                } else {
                    statusEl.innerText = "Connection Failed";
                    statusEl.className = "text-xs bg-red-500 text-white px-2.5 py-1 rounded-full";
                }
            };

            const scriptTag = document.createElement('script');
            scriptTag.src = url;
            scriptTag.onerror = function() {
                statusEl.innerText = "Connection Failed";
                statusEl.className = "text-xs bg-red-500 text-white px-2.5 py-1 rounded-full";
            };
            document.body.appendChild(scriptTag);
        }

        function renderTable(products) {
            const tbody = document.getElementById('product-table-body');
            if (!products || products.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="p-4 text-center text-gray-400">কোনো প্রোডাক্ট পাওয়া যায়নি।</td></tr>`;
                return;
            }
            tbody.innerHTML = "";
            let totalStockCount = 0;

            products.length > 0 && products.forEach(p => {
                totalStockCount += Number(p.Stock || 0);
                tbody.innerHTML += `
                    <tr class="hover:bg-gray-50">
                        <td class="p-3 font-medium text-brandBlue">${p["Product Name"] || p.ProductName || ''}</td>
                        <td class="p-3 text-gray-500">${p.Category || ''}</td>
                        <td class="p-3">৳ ${p.BuyPrice || 0}</td>
                        <td class="p-3 font-semibold text-green-600">৳ ${p.SellPrice || 0}</td>
                        <td class="p-3"><span class="bg-blue-50 text-brandBlue px-2 py-1 rounded-md text-xs font-bold">${p.Stock || 0} পিস</span></td>
                    </tr>
                `;
            });
            document.getElementById('total-stock').innerText = totalStockCount + " পিস";
        }

        function calculateSummary(data) {
            let totalSalesAmount = 0;
            let netIncomeExpense = 0;

            if (data.transactions) {
                data.transactions.forEach(tx => {
                    if (tx.Type === 'Sale') totalSalesAmount += Number(tx.TotalAmount || 0);
                });
            }

            if (data.incomeExpense) {
                data.incomeExpense.forEach(ie => {
                    if (ie.Category === 'Income') netIncomeExpense += Number(ie.Amount || 0);
                    else if (ie.Category === 'Expense') netIncomeExpense -= Number(ie.Amount || 0);
                });
            }

            document.getElementById('total-sales').innerText = "৳ " + totalSalesAmount.toLocaleString('en-IN');
            document.getElementById('net-balance').innerText = "৳ " + netIncomeExpense.toLocaleString('en-IN');
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.innerText = "সেভ হচ্ছে...";
            submitBtn.disabled = true;

            const type = document.getElementById('entry-type').value;
            const amount = document.getElementById('entry-amount').value;
            const currentDate = new Date().toISOString().split('T')[0];

            let payload = {};
            
            if (type === "Sale") {
                const productName = document.getElementById('entry-product').value;
                const quantity = document.getElementById('entry-quantity').value;
                
                if(!productName) {
                    alert("দয়া করে স্টক থেকে একটি প্রোডাক্ট সিলেক্ট করুন!");
                    submitBtn.innerText = "সেভ করুন";
                    submitBtn.disabled = false;
                    return;
                }

                payload = {
                    SheetType: "Transactions",
                    TxID: "TX-" + Date.now(),
                    Date: currentDate,
                    Type: "Sale",
                    ProductID: productName,
                    Quantity: quantity,
                    UnitPrice: (amount / quantity).toFixed(2),
                    TotalAmount: amount,
                    CustomerName: "General Customer"
                };
            } else {
                const reasonText = document.getElementById('entry-reason').value;
                let category = (type === "Expense") ? "Expense" : "Income";
                // সার্ভিসিং সিলেক্ট করলে গুগল শিটে 'সার্ভিসিং: [বিবরণ]' হিসেবে সেভ হবে
                let source = (type === "Servicing") ? `সার্ভিসিং: ${reasonText}` : reasonText;

                payload = {
                    SheetType: "IncomeExpense",
                    ID: "IE-" + Date.now(),
                    Date: currentDate,
                    Category: category,
                    Source: source,
                    Amount: amount,
                    Note: "Web App Entry"
                };
            }

            try {
                await fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                alert("সফলভাবে Google Sheet-এ সেভ হয়েছে!");
                document.getElementById('entry-form').reset();
                toggleInputFields(); // ফর্ম রিসেট করার পর ফিল্ড ঠিক করা
                setTimeout(fetchData, 2000); // নতুন স্টক লোড করার জন্য
            } catch (error) {
                alert("সেভ করতে সমস্যা হয়েছে।");
            } finally {
                submitBtn.innerText = "সেভ করুন";
                submitBtn.disabled = false;
            }
        }

        // শুরুতে ফর্ম ফিল্ড ও ডাটা ইনিশিয়ালাইজ করা 
        toggleInputFields();
        fetchData();
    </script>
</body>
</html>
